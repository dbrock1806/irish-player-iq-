<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Irish Player IQ Reset</title></head><body style="background:#071426;color:white;font-family:system-ui;padding:30px"><h2>Resetting Irish Player IQ…</h2><p id="s">Please wait.</p><script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();for(const x of r)await x.unregister()}if(window.caches){for(const k of await caches.keys())await caches.delete(k)}document.getElementById('s').textContent='Reset complete. Go back and open the app.'}catch(e){document.getElementById('s').textContent='Reset finished. Go back and open the app.'}})()</script></body></html>
