<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Irish Player IQ</title>
<style>
:root{--bg:#071426;--bg2:#0b2948;--panel:#102b49;--panel2:#0c2037;--line:#294966;--gold:#f5d467;--gold2:#ffe38a;--muted:#9eb0c3;--green:#9ff0c8;--red:#ffb7be}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071426;color:#fff}
body{min-height:100vh;background:radial-gradient(circle at top right,#123a63 0%,transparent 42%),linear-gradient(145deg,#020b17,#071426 55%,#0b2948)}
button{font:inherit;cursor:pointer}
.app{min-height:100vh}
.screen{width:100%;max-width:680px;margin:auto;padding:0 18px 42px}
.goldline{height:5px;background:linear-gradient(90deg,#c99d20,#f8d75d,#c99d20)}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 4px}
.brand{font-weight:950;letter-spacing:1px}.brand b{color:var(--gold)}
.back{display:none;background:#0b2037;color:#b7c7d7;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:800}
.eyebrow{text-align:center;color:#a9b8c8;font-size:11px;font-weight:900;letter-spacing:2px;margin:42px 0 10px}
h1{text-align:center;color:var(--gold);font-size:clamp(45px,12vw,76px);line-height:.93;margin:0 0 20px;font-weight:950;letter-spacing:-2px}
.sub{text-align:center;color:#9eb0c3;font-size:15px;line-height:1.45;margin:0 auto 24px;max-width:520px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:#102b49;border:1px solid var(--line);border-radius:14px;padding:10px 5px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:950}.stat span{display:block;color:#9fb0c2;font-size:10px;font-weight:800;letter-spacing:.8px;margin-top:2px}
.cards{display:grid;gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:linear-gradient(145deg,#102f4f,#0b223b);color:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.mode.primary{border-color:#7d6a2a;background:linear-gradient(145deg,#17395c,#0c2744)}
.mode .num{color:var(--gold);font-size:10px;font-weight:950;letter-spacing:1.5px;margin-bottom:7px}
.mode h2{margin:0 0 5px;font-size:21px}.mode p{margin:0;color:#9eb0c3;font-size:13px;line-height:1.4}
.mode:active,.answer:active,.utility button:active{transform:scale(.985)}
.gamehead{padding:18px 0 12px}.game-title{font-size:28px;font-weight:950;margin:5px 0 14px}.progress{height:5px;background:#102b49;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:35%;background:var(--gold)}
.question{background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.prompt{color:var(--gold);font-size:11px;font-weight:950;letter-spacing:1.5px;margin-bottom:10px}
.big-number{font-size:76px;font-weight:950;color:var(--gold);text-align:center;line-height:1;margin:8px 0 18px}
.player-name{font-size:32px;font-weight:950;line-height:1.05;margin:8px 0 22px}
.question h2{margin:0;font-size:28px;line-height:1.12}
.answers{display:grid;gap:9px;margin-top:14px}
.answer{width:100%;border:1px solid #365873;background:#0d2945;color:#fff;border-radius:14px;padding:14px 12px;font-size:15px;font-weight:850;text-align:left}
.answer.correct{background:#123d2d;border-color:#2e8d67}.answer.wrong{background:#48262d;border-color:#9a4b56}
.result{margin-top:10px}.message{padding:13px;border-radius:13px;font-size:13px;line-height:1.4}.correct-message{background:#10392b;color:var(--green);border:1px solid #276d51}.wrong-message{background:#45242a;color:var(--red);border:1px solid #7a3c45}
.next{display:none;width:100%;margin-top:10px;border:0;background:var(--gold);color:#071426;border-radius:13px;padding:13px;font-weight:950}
.section-title{margin:20px 0 8px;color:#aebdcc;font-size:11px;font-weight:950;letter-spacing:1.5px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modebtn{border:1px solid #365873;background:#0d2945;color:#c8d4df;border-radius:13px;padding:12px 8px;font-size:11px;font-weight:900}.modebtn.active{background:var(--gold);border-color:var(--gold);color:#071426}
.utility{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.utility button{border:1px solid #294966;background:#0b2037;color:#aebdcc;border-radius:13px;padding:12px 8px;font-size:11px;font-weight:800}
.note{text-align:center;color:#71869b;font-size:11px;line-height:1.45;margin:18px 12px 0}
.photo-card{background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:24px;padding:18px;text-align:center}.photo-placeholder{height:260px;border-radius:18px;background:linear-gradient(145deg,#163b60,#091b30);display:grid;place-items:center;color:#71869b;font-weight:900;letter-spacing:1px}.study-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.study-player{background:#0d2945;border:1px solid var(--line);border-radius:13px;padding:12px;text-align:left}.study-player b{color:var(--gold);font-size:18px}.study-player span{display:block;font-weight:800;margin-top:4px}.study-player small{color:#8fa3b7}
@media(max-width:430px){.screen{padding-left:14px;padding-right:14px}.mode{padding:16px}.mode h2{font-size:19px}.question{padding:18px}.big-number{font-size:66px}.player-name{font-size:29px}}
</style>
</head>
<body>
<div id="app"></div>

const app=document.getElementById("app");
const STORAGE="irish_player_iq_clean_v1";
let state={score:0,streak:0,best:0};
let current=null,answered=false,mode="number";

try{state=Object.assign(state,JSON.parse(localStorage.getItem(STORAGE)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function pick(){current=ROSTER[Math.floor(Math.random()*ROSTER.length)];answered=false}
function options(field,correct){let vals=[...new Set(ROSTER.map(x=>x[field]))].filter(x=>x!==correct);return shuffle([correct,...shuffle(vals).slice(0,3)])}
function top(title){return `<div class="goldline"></div><div class="top"><div class="brand">IRISH <b>PLAYER IQ</b></div><button class="back" onclick="home()">← MENU</button></div><div class="gamehead"><div class="eyebrow" style="margin:24px 0 8px;text-align:left">NOTRE DAME FOOTBALL • 2026–27</div><div class="game-title">${title}</div></div>`}
function stats(){return `<div class="stats"><div class="stat"><b>${state.score}</b><span>SCORE</span></div><div class="stat"><b>${state.streak}</b><span>STREAK</span></div><div class="stat"><b>${state.best}</b><span>BEST</span></div></div>`}
function home(){
 app.innerHTML=`<div class="screen"><div class="goldline"></div><div class="home">
 <div class="eyebrow">NOTRE DAME FOOTBALL • 2026–27</div>
 <h1>IRISH<br><span style="color:var(--gold2)">PLAYER IQ</span></h1>
 <div class="sub">Master the faces, numbers and names of the Fighting Irish roster.</div>
 ${stats()}
 <div class="cards">
  <button class="mode primary" onclick="quiz('number')"><div class="num">01 • QUICK PLAY</div><h2>NUMBER → PLAYER</h2><p>See a jersey number and position. Identify the Irish player.</p></button>
  <button class="mode" onclick="quiz('player')"><div class="num">02 • ROSTER CHALLENGE</div><h2>PLAYER → NUMBER</h2><p>See the player name. Recall the jersey number.</p></button>
  <button class="mode" onclick="study()"><div class="num">03 • PHOTO LAB</div><h2>STUDY THE IRISH</h2><p>Review players, numbers and positions. Player photos will plug into this section next.</p></button>
  <button class="mode" onclick="quiz('position')"><div class="num">04 • POSITION MODE</div><h2>NAME → POSITION</h2><p>Identify whether the player is a QB, RB, WR, DL, LB, CB, S, OL or special teams.</p></button>
 </div>
 <p class="note">Roster identity data is embedded in this single page. Duplicate jersey numbers are intentional.</p>
 </div></div>`;
}
function quiz(type){
 mode=type;pick();
 const title=type==="number"?"QUICK PLAY":type==="player"?"ROSTER CHALLENGE":"POSITION MODE";
 let prompt,display,choices,correct;
 if(type==="number"){prompt="IDENTIFY THE PLAYER";display=`<div class="big-number">#${current.num}</div><div style="text-align:center;color:#9eb0c3;font-weight:800;margin-bottom:4px">${current.pos}</div>`;choices=nameChoices();correct=current.name}
 else if(type==="player"){prompt="IDENTIFY THE NUMBER";display=`<div class="player-name">${esc(current.name)}</div><div style="color:#9eb0c3;font-weight:800;margin-bottom:4px">${current.pos}</div>`;choices=options("num",current.num);correct=current.num}
 else{prompt="IDENTIFY THE POSITION";display=`<div class="player-name">${esc(current.name)}</div><div style="color:var(--gold);font-weight:900">#${current.num}</div>`;choices=options("pos",current.pos);correct=current.pos}
 app.innerHTML=`<div class="screen">${top(title)}<div class="question"><div class="prompt">${prompt}</div>${display}<div class="answers">${choices.map((x,i)=>`<button class="answer" onclick="answer(${i},${JSON.stringify(correct)})">${esc(x)}</button>`).join("")}</div><div id="result" class="result"></div><button id="next" class="next" onclick="quiz('${type}')">NEXT QUESTION</button></div><div class="section-title">SCORE</div>${stats()}<div class="utility"><button onclick="home()">MENU</button><button onclick="resetScore()">RESET SCORE</button></div><p class="note">Number + position identifies a player when jersey numbers are duplicated.</p></div>`;
}
function nameChoices(){
 const same=ROSTER.filter(x=>x.name!==current.name && x.pos===current.pos).map(x=>x.name);
 const others=ROSTER.filter(x=>x.name!==current.name && x.pos!==current.pos).map(x=>x.name);
 return shuffle([current.name,...shuffle(same).slice(0,2),...shuffle(others).slice(0,1)]).slice(0,4);
}
function answer(i,correct){
 if(answered)return;answered=true;
 const buttons=[...document.querySelectorAll(".answer")];
 const selected=buttons[i].textContent.trim();
 buttons.forEach(b=>{b.disabled=true;if(b.textContent.trim()===correct)b.classList.add("correct")});
 const r=document.getElementById("result");
 if(selected===correct){state.score++;state.streak++;state.best=Math.max(state.best,state.streak);buttons[i].classList.add("correct");r.innerHTML=`<div class="message correct-message">✓ <strong>CORRECT!</strong><br>${esc(current.name)} — #${esc(current.num)} — ${esc(current.pos)}</div>`}
 else{state.streak=0;buttons[i].classList.add("wrong");r.innerHTML=`<div class="message wrong-message">✕ <strong>NOT QUITE.</strong><br>${esc(current.name)} wears #${esc(current.num)} and plays ${esc(current.pos)}.</div>`}
 save();document.getElementById("next").style.display="block";document.querySelectorAll(".stats").forEach(()=>{});refreshStats()
}
function refreshStats(){document.querySelectorAll(".stat b")[0].textContent=state.score;document.querySelectorAll(".stat b")[1].textContent=state.streak;document.querySelectorAll(".stat b")[2].textContent=state.best}
function resetScore(){if(!confirm("Reset your Irish Player IQ score and streak?"))return;state={score:0,streak:0,best:0};save();home()}
function study(){
 const shuffled=shuffle(ROSTER);
 app.innerHTML=`<div class="screen">${top("PHOTO LAB")}<div class="photo-card"><div class="prompt">PHOTO LAB</div><div class="photo-placeholder">PLAYER PHOTOS COMING NEXT</div><p style="color:#9eb0c3;line-height:1.45">This is where we'll add official Notre Dame player photos with the jersey number visible, so you can learn the face and number together.</p></div><div class="section-title">ROSTER REVIEW</div><div class="study-grid">${shuffled.slice(0,20).map(p=>`<div class="study-player"><b>#${p.num}</b><span>${esc(p.name)}</span><small>${p.pos}</small></div>`).join("")}</div><div class="utility"><button onclick="home()">MENU</button><button onclick="study()">SHUFFLE</button></div></div>`;
}
home();
</script>

</html>
