<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Irish Player IQ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#071426;
  color:white;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top right,#123a63 0%,transparent 42%),
    linear-gradient(145deg,#020b17,#071426 55%,#0b2948);
}

button{
  font:inherit;
  cursor:pointer;
}

#app{
  min-height:100vh;
}

.screen{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:
    max(45px,env(safe-area-inset-top))
    18px
    max(35px,env(safe-area-inset-bottom));
}

.eyebrow{
  text-align:center;
  color:#a9b8c8;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:10px;
}

h1{
  text-align:center;
  color:#f5d467;
  font-size:clamp(42px,12vw,72px);
  line-height:.95;
  margin:0 0 24px;
  font-weight:950;
  letter-spacing:-2px;
}

.subtitle{
  text-align:center;
  color:#9eb0c3;
  margin-top:-14px;
  margin-bottom:24px;
  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:16px;
}

.stat{
  background:#102b49;
  border:1px solid #294966;
  border-radius:14px;
  padding:10px 5px;
  text-align:center;
}

.stat-label{
  display:block;
  color:#9fb0c2;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.stat-value{
  display:block;
  color:white;
  font-size:20px;
  font-weight:900;
  margin-top:2px;
}

.card{
  background:rgba(255,255,255,.055);
  border:1px solid #294966;
  border-radius:24px;
  padding:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
}

.question-type{
  color:#f5d467;
  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-bottom:9px;
}

.question{
  font-size:clamp(25px,7vw,34px);
  line-height:1.12;
  font-weight:900;
  margin:0 0 20px;
}

.player-number{
  color:#f5d467;
  font-size:56px;
  line-height:1;
  font-weight:950;
  text-align:center;
  margin:5px 0 20px;
}

.position-badge{
  display:inline-block;
  background:#f5d467;
  color:#071426;
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:950;
  margin-left:5px;
  vertical-align:middle;
}

.answers{
  display:grid;
  gap:10px;
}

.answer{
  width:100%;
  background:#102f50;
  color:white;
  border:1px solid #41627d;
  border-radius:15px;
  padding:15px 12px;
  font-size:16px;
  font-weight:800;
  text-align:left;
  transition:.12s;
}

.answer:active{
  transform:scale(.98);
}

.answer.correct{
  background:#12442f;
  border-color:#49d49a;
  color:#a5f4ce;
}

.answer.wrong{
  background:#48262b;
  border-color:#e26d75;
  color:#ffb8bc;
}

.answer:disabled{
  cursor:default;
}

.result{
  margin-top:14px;
}

.correct-message,
.wrong-message{
  border-radius:13px;
  padding:13px;
  font-size:14px;
  font-weight:800;
  line-height:1.35;
}

.correct-message{
  background:#103d2b;
  color:#9cf1c7;
}

.wrong-message{
  background:#43242a;
  color:#ffb2b7;
}

.next{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
  background:#f5d467;
  color:#071426;
  font-weight:950;
}

.section-title{
  color:#aebdcc;
  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
  margin:20px 2px 9px;
}

.modes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.mode{
  border:1px solid #365873;
  background:#0d2945;
  color:#c8d4df;
  border-radius:13px;
  padding:12px 8px;
  font-size:11px;
  font-weight:900;
}

.mode.active{
  background:#f5d467;
  border-color:#f5d467;
  color:#071426;
}

.utility{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:9px;
}

.utility button{
  border:1px solid #294966;
  background:#0b2037;
  color:#aebdcc;
  border-radius:13px;
  padding:12px 8px;
  font-size:11px;
  font-weight:800;
}

.note{
  text-align:center;
  color:#71869b;
  font-size:11px;
  line-height:1.45;
  margin:18px 12px 0;
}

.loading{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:30px;
}

.loading h1{
  margin-bottom:16px;
}

.loading p{
  color:#a5b5c5;
}

@media(max-width:420px){
  .screen{
    padding-left:14px;
    padding-right:14px;
  }

  .card{
    padding:18px;
  }

  .answer{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div id="app">
  <div class="loading">
    <div class="eyebrow">NOTRE DAME FOOTBALL • 2026–27</div>
    <h1>IRISH PLAYER IQ</h1>
    <p>Loading the roster...</p>
  </div>
</div>

<script>
/*

].map(([num,name,pos]) => ({num,name,pos}));


/* -----------------------------
   GAME STATE
----------------------------- */

let state = {
  score: Number(localStorage.getItem("ipiq_score") || 0),
  streak: Number(localStorage.getItem("ipiq_streak") || 0),
  best: Number(localStorage.getItem("ipiq_best") || 0),
  total: Number(localStorage.getItem("ipiq_total") || 0)
};

let current = null;
let mode = "numToName";
let answered = false;


/* -----------------------------
   STORAGE
----------------------------- */

function saveState(){
  try{
    localStorage.setItem("ipiq_score",state.score);
    localStorage.setItem("ipiq_streak",state.streak);
    localStorage.setItem("ipiq_best",state.best);
    localStorage.setItem("ipiq_total",state.total);
  }catch(e){}
}


/* -----------------------------
   HELPERS
----------------------------- */

function esc(value){
  return String(value).replace(/[&<>"']/g,character => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[character]));
}

function shuffle(array){
  return [...array].sort(() => Math.random() - 0.5);
}

function pickPlayer(){
  current = ROSTER[Math.floor(Math.random() * ROSTER.length)];
}

function uniqueValues(field){
  return [...new Set(ROSTER.map(player => player[field]))];
}


/*
  This is important because jersey numbers are duplicated.

  We NEVER treat #1, #2, etc. as automatically identifying
  one player.
*/
function playersWithNumber(number){
  return ROSTER.filter(player => player.num === number);
}

function answerChoices(correct,field,count=4){
  const others = uniqueValues(field)
    .filter(value => value !== correct);

  return shuffle([
    correct,
    ...shuffle(others).slice(0,count-1)
  ]);
}


/* -----------------------------
   QUESTION TYPES
----------------------------- */

const MODES = [
  "numToName",
  "nameToNum",
  "nameToPos",
  "numPosToName"
];

function questionTypeLabel(){
  if(mode === "numToName") return "NUMBER + POSITION → NAME";
  if(mode === "nameToNum") return "NAME → NUMBER";
  if(mode === "nameToPos") return "NAME → POSITION";
  return "NUMBER + POSITION → NAME";
}

function questionText(){

  if(mode === "numToName"){
    return `Who wears #${current.num} at ${current.pos}?`;
  }

  if(mode === "nameToNum"){
    return `What number does ${current.name} wear?`;
  }

  if(mode === "nameToPos"){
    return `What position does ${current.name} play?`;
  }

  return `Who is #${current.num}, ${current.pos}?`;
}

function getChoices(){

  if(mode === "numToName"){
    return answerChoices(current.name,"name");
  }

  if(mode === "nameToNum"){

    /*
      Numbers are allowed to repeat because the player
      is already identified by name.
    */
    return answerChoices(current.num,"num");
  }

  if(mode === "nameToPos"){
    return answerChoices(current.pos,"pos");
  }

  /*
    Number + position uniquely identifies the player.
  */
  const samePosition = ROSTER
    .filter(p => p.pos === current.pos && p.name !== current.name)
    .map(p => p.name);

  return shuffle([
    current.name,
    ...shuffle(samePosition).slice(0,3),
    ...shuffle(ROSTER
      .filter(p => p.name !== current.name && p.pos !== current.pos)
      .map(p => p.name)
    ).slice(0,Math.max(0,3-samePosition.length))
  ]).slice(0,4);
}


/* -----------------------------
   RENDER
----------------------------- */

function render(){

  const choices = getChoices();

  document.getElementById("app").innerHTML = `
    <main class="screen">

      <div class="eyebrow">
        NOTRE DAME FOOTBALL • 2026–27
      </div>

      <h1>IRISH PLAYER IQ</h1>

      <div class="subtitle">
        Learn the roster. One player at a time.
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Score</span>
          <span class="stat-value">${state.score}</span>
        </div>

        <div class="stat">
          <span class="stat-label">Streak</span>
          <span class="stat-value">${state.streak}</span>
        </div>

        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value">${state.best}</span>
        </div>
      </div>

      <section class="card">

        <div class="question-type">
          ${questionTypeLabel()}
        </div>

        <h2 class="question">
          ${questionText()}
        </h2>

        <div class="answers">
          ${choices.map((choice,index) => `
            <button
              class="answer"
              data-index="${index}"
            >
              ${esc(choice)}
            </button>
          `).join("")}
        </div>

        <div id="result" class="result"></div>

        <button
          id="next"
          class="next"
          style="display:none"
        >
          NEXT QUESTION
        </button>

      </section>


      <div class="section-title">
        QUIZ MODE
      </div>

      <div class="modes">

        <button
          class="mode ${mode==="numToName" ? "active" : ""}"
          data-mode="numToName"
        >
          # + POS → NAME
        </button>

        <button
          class="mode ${mode==="nameToNum" ? "active" : ""}"
          data-mode="nameToNum"
        >
          NAME → #
        </button>

        <button
          class="mode ${mode==="nameToPos" ? "active" : ""}"
          data-mode="nameToPos"
        >
          NAME → POS
        </button>

        <button
          class="mode ${mode==="numPosToName" ? "active" : ""}"
          data-mode="numPosToName"
        >
          # + POS → NAME
        </button>

      </div>

      <div class="utility">

        <button id="reset">
          RESET SCORE
        </button>

        <button id="newQuestion">
          NEW QUESTION
        </button>

      </div>

      <p class="note">
        Duplicate jersey numbers are handled intentionally.
        A number by itself is never treated as enough information
        to identify a player.
      </p>

    </main>
  `;


  /* Answer buttons */

  document.querySelectorAll(".answer").forEach(button => {

    button.addEventListener("click",() => {

      if(answered) return;

      answer(Number(button.dataset.index));

    });

  });


  /* Next question */

  document
    .getElementById("next")
    .addEventListener("click",newQuestion);


  /* Mode buttons */

  document.querySelectorAll("[data-mode]").forEach(button => {

    button.addEventListener("click",() => {

      mode = button.dataset.mode;

      newQuestion();

    });

  });


  /* New question */

  document
    .getElementById("newQuestion")
    .addEventListener("click",newQuestion);


  /* Reset */

  document
    .getElementById("reset")
    .addEventListener("click",() => {

      if(!confirm("Reset your Irish Player IQ score and streak?")){
        return;
      }

      state.score = 0;
      state.streak = 0;
      state.best = 0;
      state.total = 0;

      saveState();
      newQuestion();

    });

}


/* -----------------------------
   ANSWER
----------------------------- */

function answer(index){

  answered = true;

  const buttons = [
    ...document.querySelectorAll(".answer")
  ];

  const selected = buttons[index].textContent.trim();

  let correct;

  if(mode === "numToName"){
    correct = current.name;
  }
  else if(mode === "nameToNum"){
    correct = current.num;
  }
  else if(mode === "nameToPos"){
    correct = current.pos;
  }
  else{
    correct = current.name;
  }

  buttons.forEach(button => {

    button.disabled = true;

    if(button.textContent.trim() === correct){
      button.classList.add("correct");
    }

  });


  const result = document.getElementById("result");

  state.total++;


  if(selected === correct){

    state.score++;
    state.streak++;

    if(state.streak > state.best){
      state.best = state.streak;
    }

    result.innerHTML = `
      <div class="correct-message">
        ✓ CORRECT!
        <br>
        ${esc(current.name)}
        — #${esc(current.num)}
        — ${esc(current.pos)}
      </div>
    `;

  }else{

    state.streak = 0;

    const selectedButton = buttons[index];

    if(selectedButton){
      selectedButton.classList.add("wrong");
    }

    result.innerHTML = `
      <div class="wrong-message">
        ✗ NOT QUITE
        <br><br>
        <strong>${esc(current.name)}</strong>
        wears <strong>#${esc(current.num)}</strong>
        and plays <strong>${esc(current.pos)}</strong>.
      </div>
    `;

  }


  saveState();

  document.getElementById("next").style.display = "block";

  updateStats();

}


/* -----------------------------
   UPDATE SCORE
----------------------------- */

function updateStats(){

  const stats = document.querySelector(".stats");

  if(!stats) return;

  stats.innerHTML = `

    <div class="stat">
      <span class="stat-label">Score</span>
      <span class="stat-value">${state.score}</span>
    </div>

    <div class="stat">
      <span class="stat-label">Streak</span>
      <span class="stat-value">${state.streak}</span>
    </div>

    <div class="stat">
      <span class="stat-label">Best</span>
      <span class="stat-value">${state.best}</span>
    </div>

  `;

}


/* -----------------------------
   NEW QUESTION
----------------------------- */

function newQuestion(){

  answered = false;

  pickPlayer();

  render();

}


/* -----------------------------
   START
----------------------------- */

try{

  newQuestion();

}catch(error){

  console.error(error);

  document.getElementById("app").innerHTML = `
    <div class="loading">

      <div class="eyebrow">
        NOTRE DAME FOOTBALL
      </div>

      <h1>IRISH PLAYER IQ</h1>

      <p>
        Something went wrong starting the quiz.
      </p>

      <p>
        Please refresh the page.
      </p>

    </div>
  `;

}
</script>

</body>
</html>
