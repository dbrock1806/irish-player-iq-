<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Irish Player IQ</title>
<style>
:root{--navy:#071426;--navy2:#0d2743;--gold:#c9a227;--gold2:#f0d477;--white:#f7f7f5;--muted:#9baabd;--green:#145f43;--red:#7f2c2c}
*{box-sizing:border-box}body{margin:0;background:#020812;color:var(--white);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;background:radial-gradient(circle at 85% 8%,#173b62 0,transparent 32%),linear-gradient(145deg,var(--navy),#030a12);overflow:hidden}
.goldline{height:5px;background:linear-gradient(90deg,#80600f,var(--gold2),#80600f)}
.top{height:72px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:12px;font-weight:950;letter-spacing:.16em}.brand b{color:var(--gold2)}
.back{background:#ffffff0d;border:1px solid #ffffff25;color:#fff;border-radius:9px;padding:9px 12px;font-size:11px;font-weight:850}
.screen{min-height:100vh}.home{padding:25px 18px 45px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--gold2)}
h1{font-size:clamp(48px,14vw,82px);line-height:.84;letter-spacing:-.06em;margin:9px 0 15px;font-weight:950}.sub{font-size:14px;line-height:1.45;color:var(--muted);max-width:500px}
.stats{display:flex;gap:9px;margin:22px 0 30px}.stat{background:#ffffff09;border:1px solid #ffffff16;border-radius:10px;padding:10px 14px}.stat b{display:block;font-size:21px}.stat span{font-size:9px;color:var(--muted);letter-spacing:.12em}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:11px}.mode{min-height:160px;padding:18px;text-align:left;border-radius:14px;border:1px solid #ffffff19;background:linear-gradient(145deg,#102b49,#071522);color:#fff;position:relative;overflow:hidden}.mode.primary{border-color:#c9a22788;background:linear-gradient(145deg,#183e66,#091a2d)}.mode .num{font-size:9px;color:var(--gold2);font-weight:900;letter-spacing:.14em}.mode h2{font-size:20px;line-height:1;margin:13px 0 7px;font-weight:950}.mode p{font-size:11px;color:var(--muted);line-height:1.45;margin:0}.mode:after{content:"";position:absolute;width:110px;height:110px;border:15px solid #c9a2270c;right:-40px;bottom:-40px;transform:rotate(20deg)}
.gamehead{padding:20px 18px 8px}.game-title{font-size:30px;font-weight:950;letter-spacing:-.04em;margin:6px 0}.progress{height:4px;background:#ffffff18;border-radius:4px;margin-top:15px}.progress i{display:block;height:100%;width:0;background:var(--gold);transition:.25s}
.question{margin:14px 18px;padding:30px 16px;border:1px solid #ffffff18;background:linear-gradient(150deg,#102b49,#071522);border-radius:15px;text-align:center}.prompt{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.17em}.big-number{font-size:96px;line-height:.95;font-weight:950;color:var(--gold2);margin:18px 0}.player-name{font-size:30px;font-weight:950;margin:22px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 18px}.answer{min-height:61px;border:1px solid #ffffff18;background:#10263e;border-radius:11px;color:#fff;padding:13px;text-align:left;font-size:14px;font-weight:750}.answer.correct{background:linear-gradient(135deg,#174c38,#0d3025);border-color:#65c49e;box-shadow:inset 4px 0 #65c49e}.answer.wrong{background:linear-gradient(135deg,#522323,#301919);border-color:#d35f5f;box-shadow:inset 4px 0 #d35f5f}.answer.dim{opacity:.48}
.result{margin:14px 18px;padding:17px;border-radius:12px;border:1px solid #c9a22788;background:linear-gradient(135deg,#c9a22718,#ffffff05);display:none}.result.show{display:block}.result strong{font-size:18px}.result small{display:block;color:var(--muted);margin-top:5px;line-height:1.45}.next{margin:10px 18px 24px;width:calc(100% - 36px);height:57px;border:0;border-radius:10px;background:linear-gradient(135deg,#dfc05b,#a47d13);color:#071426;font-weight:950;letter-spacing:.08em}
.photo{margin:14px 18px;min-height:440px;border-radius:15px;border:1px solid #ffffff19;background:#0b1d30;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{text-align:center;padding:45px}.nd{font-size:80px;line-height:1;font-weight:950;color:var(--gold)}.photo-tag{position:absolute;bottom:12px;left:12px;background:#030b14e8;border:1px solid #ffffff20;padding:9px 12px;border-radius:8px;font-size:10px}
.card{margin:14px 18px;padding:18px;background:#0d233a;border:1px solid #ffffff18;border-radius:14px}.pill{display:inline-block;border:1px solid #c9a22788;color:var(--gold2);padding:5px 8px;border-radius:99px;font-size:9px;font-weight:900;letter-spacing:.1em}.card h3{font-size:24px;margin:12px 0 5px}.card p{font-size:12px;line-height:1.5;color:var(--muted)}
.advanced-photo{position:relative;margin:14px 18px}.advanced-photo .photo{margin:0}.mask{position:absolute;left:18%;right:18%;top:43%;height:20%;background:#030a12;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:950;letter-spacing:.14em;color:var(--gold2);transform:skew(-5deg)}
.inputs{display:grid;grid-template-columns:1fr 90px;gap:10px;margin:14px 18px}.label{display:block;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.1em;margin-bottom:6px}.input{width:100%;background:#0c1e31;border:1px solid #ffffff22;color:#fff;border-radius:10px;padding:14px;outline:none}.input:focus{border-color:var(--gold)}
.note{margin:14px 18px;padding:13px;border:1px solid #ffffff13;border-radius:10px;color:var(--muted);font-size:11px;line-height:1.45}
@media(max-width:520px){.cards,.answers{grid-template-columns:1fr}.mode{min-height:125px}.photo{min-height:400px}.big-number{font-size:80px}}
</style>
</head>
<body>
<div id="app" class="app"><div style="padding:60px 20px;font-family:system-ui;color:#f0d477;text-align:center"><h1 style="font-size:38px;margin:0 0 12px">IRISH PLAYER IQ</h1><p style="color:#9baabd">Loading the app…</p></div></div>
<script>
const roster=[
["0","Tionne Gray"],["0","Quincy Porter"],["1","Dallas Golden"],["1","Jaden Greathouse"],
["2","Nolan James Jr."],["2","DJ McKinney"],["3","Mylan Graham"],["3","Jaylen Sneed"],
["4","Bubba Frazier"],["4","Jaiden Ausberry"],["5","Cam Williams"],["5","Boubacar Traore"],
["6","Christopher Burgess Jr."],["6","Jordan Faison"],["7","Francis Brewu"],["7","Ty Washington"],
["8","Jerome Bettis Jr."],["8","Adon Shuler"],["9","Brauntae Johnson"],["9","Teddy Jarrard"],
["10","Noah Grubbs"],["10","Loghan Thomas"],["11","Keon Keeley"],["11","Devin Fitzgerald"],
["12","Jayden Sanders"],["12","Blake Hebert"],["13","Ayden Pouncey"],["13","CJ Carr"],
["14","Ebenezer Ewetade"],["14","Micah Gilbert"],["15","Brayden Robinson"],["15","Leonard Moore"],
["16","Dylan Faison"],["16","Ko'o Kia"],["17","Elijah Burress"],["17","Brenan Vernon"],
["18","Kaydon Finley"],["18","Erik Schmidt"],["19","Madden Faraimo"],["19","Logan Saldate"],
["20","Joey O'Brien"],["20","Jonaz Walton"],["21","Khary Adams"],["21","Kedren Young"],
["22","Ethan Long"],["22","Aneyas Williams"],["23","Ja'Kobe Clapper"],["24","Mark Zackery IV"],
["24","Ian Premer"],["25","Brandon Logan"],["26","Chaz Smith"],["26","Javian Osborne"],
["27","Kyngstonn Viliamu-Asa"],["28","Luke Talich"],["29","Christian Gray"],["30","Patrick Downes"],
["31","Xavier Southall"],["32","Nick Reddish"],["33","Matt Jeffery"],["34","Drayk Bowen"],
["35","Spencer Porath"],["35","Teddy Rezac"],["36","Micah Drescher"],["37","Kurt Smith"],
["38","Tommy Powlus"],["39","Jasper Scaife"],["40","Dominik Hulak"],["42","Cole Mullins"],
["42","Henry Garrity"],["43","Kahanu Kia"],["44","Rodney Dunham"],["46","Matt Williams"],
["47","Jason Onye"],["48","Chase Young"],["49","Andrew Kros"],["50","Sullivan Garvin"],
["51","Ben Nichols"],["52","Devan Houstan"],["54","Anthonie Knapp"],["55","Tiki Hola"],
["55","Chris Terek"],["56","Elijah Hughes"],["56","Charles Jagusah"],["57","Cam Herron"],
["58","Thomas Davis Jr."],["58","Matty Augustine"],["59","Sean Sevillano Jr."],["60","Davion Dixon"],
["60","Max Anderson"],["61","Robbie Wollan"],["64","Joe Otting"],["65","Grayson McKeogh"],
["66","Tyler Merrill"],["67","Gregory Patrick"],["68","Charlie Thom"],["70","Ashton Craig"],
["71","Styles Prescod"],["74","Will Black"],["75","Sullivan Absher"],["76","Guerby Lambert"],
["77","Peter Jones"],["78","Owen Strebig"],["84","Preston Fryzel"],["85","Jack Larsen"],
["86","Kaleb Johnson"],["87","Cooper Flanagan"],["88","James Flanigan"],["88","Armel Mukam"],
["89","Austin Ratigan"],["90","Elijah Golden"],["91","Gordy Sulfsted"],["94","Joe Reiff"],
["95","Bryce Young"],["96","Joseph Vinci"]
].map(x=>({num:x[0],name:x[1]}));

let score=0,streak=0,current=null,answered=false;
const app=document.getElementById("app"), norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
function top(){return `<div class="goldline"></div><div class="top"><div class="brand">IRISH <b>PLAYER IQ</b></div><button class="back" onclick="home()">← MENU</button></div>`}
function home(){app.innerHTML=`<div class="screen"><div class="goldline"></div><div class="home"><div class="eyebrow">NOTRE DAME FOOTBALL • 2026–27</div><h1>IRISH<br><span style="color:var(--gold2)">PLAYER IQ</span></h1><div class="sub">Master the faces, numbers and names of the Fighting Irish roster.</div><div class="stats"><div class="stat"><b>${score}</b><span>SCORE</span></div><div class="stat"><b>${streak}</b><span>STREAK</span></div><div class="stat"><b>2026</b><span>ROSTER</span></div></div><div class="cards">
<button class="mode primary" onclick="quiz('number')"><div class="num">01 • QUICK PLAY</div><h2>NUMBER → PLAYER</h2><p>See a jersey number. Identify the Irish player.</p></button>
<button class="mode" onclick="quiz('player')"><div class="num">02 • ROSTER CHALLENGE</div><h2>PLAYER → NUMBER</h2><p>See the player name. Recall the jersey number.</p></button>
<button class="mode" onclick="study()"><div class="num">03 • PHOTO LAB</div><h2>STUDY THE IRISH</h2><p>Learn faces, uniforms and jersey numbers visually.</p></button>
<button class="mode" onclick="advanced()"><div class="num">04 • ELITE MODE</div><h2>HIDDEN NUMBER</h2><p>Identify the player AND number from the photo.</p></button>
</div></div></div>`}
function pick(){current=roster[Math.floor(Math.random()*roster.length)];answered=false}
function options(kind){const correct=kind==="name"?current.name:current.num;let a=[...new Set(roster.map(x=>kind==="name"?x.name:x.num))].filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,3);return [correct,...a].sort(()=>Math.random()-.5)}
function quiz(type){pick();const ask=type==="number";app.innerHTML=top()+`<div class="gamehead"><div class="eyebrow">${ask?"QUICK PLAY":"ROSTER CHALLENGE"}</div><div class="game-title">${ask?"WHO WEARS IT?":"KNOW YOUR IRISH"}</div><div class="progress"><i id="prog"></i></div></div><div class="question"><div class="prompt">${ask?"IDENTIFY THE PLAYER":"IDENTIFY THE NUMBER"}</div>${ask?`<div class="big-number">#${current.num}</div>`:`<div class="player-name">${current.name}</div>`}</div><div class="answers">${options(ask?"name":"num").map(x=>`<button class="answer" data-v="${x.replace(/"/g,"&quot;")}">${x}</button>`).join("")}</div><div id="result" class="result"></div><button id="next" class="next" style="display:none" onclick="quiz('${type}')">NEXT PLAY →</button>`;
document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answer(b,type));}
function answer(btn,type){if(answered)return;answered=true;const wanted=type==="number"?current.name:current.num;document.querySelectorAll(".answer").forEach(b=>{if(b.dataset.v===wanted)b.classList.add("correct");else b.classList.add("dim")});let ok=btn.dataset.v===wanted;if(ok){btn.classList.remove("dim");score++;streak++}else{btn.classList.add("wrong");streak=0}const r=document.getElementById("result");r.innerHTML=`<strong>${ok?"✓ CORRECT":"✕ NOT QUITE"}</strong><small>${ok?"":"The correct answer is "}${current.name} — #${current.num}. The correct answer is highlighted above.</small>`;r.classList.add("show");document.getElementById("next").style.display="block";document.getElementById("prog").style.width="100%"}
function study(){app.innerHTML=top()+`<div class="gamehead"><div class="eyebrow">PHOTO LAB</div><div class="game-title">LEARN THE IRISH</div><div class="sub">Build the visual association: face + uniform + number.</div></div><div class="photo"><div class="placeholder"><div class="nd">ND</div><div style="font-weight:900;margin-top:14px">VERIFIED PLAYER PHOTO LIBRARY</div><div style="font-size:11px;color:var(--muted);margin-top:7px">Only verified in-uniform images with the exposed jersey number belong in scored photo questions.</div></div><div class="photo-tag">2026–27 • PHOTO STANDARD</div></div><div class="card"><span class="pill">PHOTO SOURCE POLICY</span><h3>Official + Verified Public Images</h3><p>Official Notre Dame photography is preferred. Public Instagram imagery may be used when the player identity, Notre Dame uniform and exposed number can be verified.</p></div><button class="next" onclick="studyPlayer()">SHOW ROSTER CARD →</button>`}
function studyPlayer(){const p=roster[Math.floor(Math.random()*roster.length)];app.querySelector(".card").innerHTML=`<span class="pill">ROSTER CARD</span><h3>${p.name}</h3><p style="font-size:28px;color:var(--gold2);font-weight:950">#${p.num}</p><p>Use the name and number together as your memory anchor. A verified player photo can be attached to this card as the library grows.</p>`}
function advanced(){pick();app.innerHTML=top()+`<div class="gamehead"><div class="eyebrow">ELITE MODE</div><div class="game-title">IDENTIFY THE IRISH</div><div class="sub">Both the player and jersey number must be correct.</div></div><div class="advanced-photo"><div class="photo"><div class="placeholder"><div class="nd">ND</div><div style="font-weight:900;margin-top:14px">VERIFIED PLAYER PHOTO</div><div style="font-size:11px;color:var(--muted);margin-top:7px">The jersey number is hidden for this challenge.</div></div></div><div class="mask">NUMBER HIDDEN</div></div><div class="inputs"><div><span class="label">PLAYER NAME</span><input id="pname" class="input" placeholder="Enter player"></div><div><span class="label">NUMBER</span><input id="pnum" class="input" inputmode="numeric" placeholder="#"></div></div><button class="next" onclick="checkAdvanced()">SUBMIT ANSWER →</button><div id="advresult" class="result"></div>`}
function checkAdvanced(){const n=document.getElementById("pname").value,num=document.getElementById("pnum").value,r=document.getElementById("advresult"),ok=norm(n)===norm(current.name)&&num===current.num;if(ok){score++;streak++;r.innerHTML=`<strong>✓ PERFECT READ</strong><small>${current.name} • #${current.num}</small>`}else{streak=0;r.innerHTML=`<strong>✕ KEEP STUDYING</strong><small>Correct answer: ${current.name} • #${current.num}</small>`}r.classList.add("show");r.insertAdjacentHTML("afterend",`<button class="next" onclick="advanced()">NEXT CHALLENGE →</button>`)}
(async function(){
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
  }catch(e){}
  home();
})();
</script>
</body>
</html>
